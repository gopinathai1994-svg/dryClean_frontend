<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
  <script>
    (function () {
      var blockedAnalyticsHost = 'www.google-analytics.com';
      var blockedAnalyticsPath = '/mp/collect';

      function isBlockedAnalyticsUrl(input) {
        try {
          var rawUrl = typeof input === 'string' ? input : input && input.url;
          if (!rawUrl) {
            return false;
          }

          var url = new URL(rawUrl, window.location.origin);
          return url.hostname === blockedAnalyticsHost && url.pathname === blockedAnalyticsPath;
        } catch (_) {
          return false;
        }
      }

      var originalFetch = window.fetch;
      if (originalFetch) {
        window.fetch = function (input, init) {
          if (isBlockedAnalyticsUrl(input)) {
            return Promise.resolve(new Response(null, { status: 204, statusText: 'No Content' }));
          }

          return originalFetch.apply(this, arguments);
        };
      }

      var originalSendBeacon = navigator.sendBeacon;
      if (originalSendBeacon) {
        navigator.sendBeacon = function (url, data) {
          if (isBlockedAnalyticsUrl(url)) {
            return true;
          }

          return originalSendBeacon.call(this, url, data);
        };
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
